<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#38aa34"><title>Калькулятор ПА</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css"></head>
<body>
<header><img id="logo" src="logo.svg" alt="Евразия"><h1 data-i18n="app.title">Калькулятор ПА</h1><select id="lang" aria-label="Language"><option value="ru">Рус</option><option value="kk">Қаз</option><option value="en">Eng</option></select></header>
<main>
<section id="tab-calc" class="tab active">
 <form id="f" autocomplete="off">
  <label class="inline"><input type="checkbox" id="transfer"> <span data-i18n="f.transfer">Переоформление договора из другой КСЖ</span></label>
  <div id="transferWrap" hidden><div class="row"><label><span data-i18n="f.oldDate">Дата действующего договора</span><input id="oldDate" type="date"></label>
  <label><span data-i18n="f.surr">Выкупная сумма на дату заключения, ₸</span><input id="surr" inputmode="numeric" placeholder="0"></label></div>
  <p class="hint" data-i18n="f.transferHint">С даты</p></div>
  <label><span data-i18n="f.name">Клиент</span><input id="name" type="text" placeholder="Имя клиента" data-i18n-ph="f.namePh"></label>
  <div class="row"><label><span data-i18n="f.dob">Дата рождения</span><input id="dob" type="date" required></label>
  <label><span data-i18n="f.sign">Дата заключения</span><input id="sign" type="date" required></label></div>
  <div class="row"><label><span data-i18n="f.gender">Пол</span><select id="gender"><option value="мужской" data-i18n="f.male">мужской</option><option value="женский" data-i18n="f.female">женский</option></select></label>
  <label><span data-i18n="f.oppv">ОППВ</span><select id="oppv"><option value="нет" data-i18n="f.no">нет</option><option value="да" data-i18n="f.yes">да</option></select></label></div>
  <label><span data-i18n="f.dis">Инвалидность</span><select id="disability"><option value="нет" data-i18n="f.no">нет</option><option value="инвалидность 1 группы" data-i18n="f.dis1">1</option><option value="инвалидность 2 группы" data-i18n="f.dis2">2</option><option value="инвалидность 3 группы" data-i18n="f.dis3">3</option></select></label>
  <label><span data-i18n="f.enpf">Накопления в ЕНПФ, ₸</span><input id="enpf" inputmode="numeric" placeholder="0" required></label>
  <label><span data-i18n="f.reserve">Остаток</span><select id="reserve"><option value="0">0%</option><option value="0.005">0,5%</option><option value="0.01">1%</option><option value="0.015">1,5%</option><option value="0.02">2%</option></select></label>
  <div class="row"><label><span data-i18n="f.own">Собственные средства, ₸</span><input id="own" inputmode="numeric" placeholder="0"></label>
  <label id="lumpWrap"><span data-i18n="f.lump">Единовременная выплата</span><select id="lumpPct"><option value="0.08" data-i18n="f.lump8">8%</option><option value="0.06">6%</option></select></label></div>
  <label><span data-i18n="f.mode">Что считаем</span><select id="mode"><option value="min" data-i18n="f.modeMin">Минимальный</option><option value="max" data-i18n="f.modeMax">Все</option><option value="custom" data-i18n="f.modeCustom">Своя</option></select></label>
  <label id="contractWrap" hidden><span data-i18n="f.contract">Сумма договора, ₸</span><input id="contract" inputmode="numeric"></label>
  <label><span data-i18n="f.gp">Гарантированный период, лет</span><select id="gpA"></select></label>
  <button class="primary" type="submit" data-i18n="f.go">Рассчитать</button>
 </form>
 <div id="warn" class="warn" hidden></div>
 <div id="result" hidden>
  <h2 data-i18n="r.title">Результат</h2>
  <div id="cards"></div>
  <div class="actions">
   <button id="bCopy" data-i18n="r.copy">Скопировать текст</button>
   <button id="bShareTxt" data-i18n="r.share">Отправить текст</button>
   <button id="bPdf" class="primary" data-i18n="r.pdf">PDF с графиком</button>
   <button id="bSave" data-i18n="r.save">Сохранить в историю</button>
  </div>
  <label class="inline"><input type="checkbox" id="pdfMonthly" checked> <span data-i18n="r.pdfMonthly">В PDF</span></label>
  <select id="pdfVar" hidden></select>
  <details><summary data-i18n="r.yearly">Выплаты по годам</summary><div id="yearly" class="tbl"></div></details>
  <details><summary data-i18n="r.monthly">Помесячный</summary><div id="monthly" class="tbl"></div></details>
  <details><summary data-i18n="r.text">Текст расчёта</summary><pre id="txt"></pre></details>
 </div>
</section>
<section id="tab-hist" class="tab">
 <input id="search" type="search" placeholder="Поиск по имени" data-i18n-ph="h.search">
 <div id="hist"></div>
 <div class="actions"><button id="bExport" data-i18n="h.export">Экспорт истории</button><label class="btn"><span data-i18n="h.import">Импорт</span><input id="imp" type="file" accept="application/json" hidden></label></div>
</section>
<section id="tab-set" class="tab">
 <h2 data-i18n="s.title">Настройки</h2>
 <label><span data-i18n="s.gp">Гарантированный период по умолчанию, лет</span><select id="sGpA"></select></label>
 <label><span data-i18n="s.agent">Ваше имя</span><input id="sAgent" placeholder="Аскар, +7 ..." data-i18n-ph="s.agentPh"></label>
 <h3 data-i18n="s.lm">Прожиточный минимум по годам, ₸</h3>
 <p class="hint" data-i18n="s.lmHint">Нужен</p>
 <div id="lmTable"></div>
 <button id="sSave" class="primary" data-i18n="s.save">Сохранить настройки</button>
 <p class="hint" id="ver"></p>
</section>
</main>
<nav><button data-tab="tab-calc" class="on" data-i18n="tab.calc">Расчёт</button><button data-tab="tab-hist" data-i18n="tab.hist">История</button><button data-tab="tab-set" data-i18n="tab.set">Настройки</button></nav>
<script src="i18n.js"></script><script src="mort.js"></script><script src="engine.js"></script><script src="quote.js"></script>
<script src="lib/jspdf.umd.min.js"></script><script src="lib/jspdf.plugin.autotable.min.js"></script><script src="lib/fonts.js"></script>
<script src="app.js"></script>
</body></html>
