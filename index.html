<script>
(async () => {
  const P = JSON.parse(document.getElementById('payload').textContent), K = 'annu_auth', S = crypto.subtle;
  const $ = id => document.getElementById(id), f = $('f');
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const get = () => { try { return JSON.parse(localStorage.getItem(K)); } catch (e) { return null; } };
  const drop = () => { try { localStorage.removeItem(K); } catch (e) {} };
  async function open(raw, exp) {
    const key = await S.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const gz = await S.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.ct));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const left = exp - Date.now();
    const guard = '<script>(function(){var x=' + exp + ';function c(){if(Date.now()>=x){try{localStorage.removeItem("' + K + '")}catch(e){}location.reload()}}setTimeout(c,' + Math.max(left, 0) + '+500);document.addEventListener("visibilitychange",c);window.annuLogout=function(){x=0;c()}})()<\/script>';
    const at = html.lastIndexOf('</body>'); document.open(); document.write(at < 0 ? html + guard : html.slice(0, at) + guard + html.slice(at)); document.close();
  }
  const s = get();
  if (s && s.v === P.v && s.exp > Date.now()) { try { await open(u8(s.k), s.exp); return; } catch (e) { drop(); } } else drop();
  f.hidden = false; $('l').focus();
  f.onsubmit = async ev => {
    ev.preventDefault(); $('e').textContent = ''; $('b').disabled = true; $('b').textContent = 'Проверка…';
    try {
      if (!S) throw new Error('nocrypto');
      const login = $('l').value.normalize('NFKC').trim().toLowerCase();
      const base = await S.importKey('raw', new TextEncoder().encode(login + '\n' + $('p').value), 'PBKDF2', false, ['deriveKey']);
      let raw = null;
      for (const t of P.slots) {
        const kek = await S.deriveKey({ name: 'PBKDF2', salt: u8(t.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        try { raw = await S.decrypt({ name: 'AES-GCM', iv: u8(t.i) }, kek, u8(t.w)); break; } catch (e) {}
      }
      if (!raw) throw new Error('bad');
      const exp = Date.now() + P.h * 3600e3;
      try { localStorage.setItem(K, JSON.stringify({ v: P.v, k: b64(raw), exp })); } catch (e) {}
      await open(raw, exp);
    } catch (e) {
      $('e').textContent = e.message === 'nocrypto' ? 'Откройте страницу по https-ссылке.' : 'Неверный логин или пароль';
      $('b').disabled = false; $('b').textContent = 'Войти'; $('p').value = ''; $('p').focus();
    }
  };
})();
</script></body></html>
